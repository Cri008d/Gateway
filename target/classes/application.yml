server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      # ------------------------------------------
      routes:
        # 1. Ruta para el Microservicio de Reportes de Incendios
        - id: ms-deteccion-y-reporte
          uri: https://ms-deteccion-y-reporte.onrender.com
          predicates:
            - Path=/api/reportes/**

        # 2.Redirige las peticiones de usuarios al mismo microservicio
        - id: ms-usuarios-routing
          uri: https://ms-deteccion-y-reporte.onrender.com
          predicates:
            - Path=/api/v1/usuarios/**
        # 3. Ruta alertas
        - id: ms-alertas-routing
          uri: https://ms-deteccion-y-reporte.onrender.com
          predicates:
            - Path=/api/alertas/**