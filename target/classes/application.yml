server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # --- AGREGAR CONFIGURACIÓN DE CORS AQUÍ ---
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" # O la URL específica de tu frontend en Render
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      # ------------------------------------------
      routes:
        # 1. Ruta para el Microservicio de Reportes de Incendios
        - id: ms-deteccion-y-reporte
          uri: https://ms-deteccion-y-reporte.onrender.com
          predicates:
            - Path=/api/reportes/**

        # 2. NUEVA RUTA: Redirige las peticiones de usuarios al mismo microservicio
        - id: ms-usuarios-routing
          uri: https://ms-deteccion-y-reporte.onrender.com
          predicates:
            - Path=/api/v1/usuarios/**